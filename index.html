  <!--
    MindAR 1.2.5 預設向瀏覽器取得相機時沒有指定 HD 尺寸。
    這裡只加「ideal」條件，裝置不支援時仍會自動退回可用解析度。
    1280x720 是畫質 / 效能較平衡的設定；若要測 1080p，可改成 1920 / 1080。
  -->
  <script>
    (() => {
      const mediaDevices = navigator.mediaDevices;
      if (!mediaDevices || !mediaDevices.getUserMedia) return;

      const originalGetUserMedia = mediaDevices.getUserMedia.bind(mediaDevices);

      try {
        mediaDevices.getUserMedia = async (constraints = {}) => {
          if (constraints.video && typeof constraints.video === "object") {
            const video = { ...constraints.video };

            if (video.width == null) video.width = { ideal: 1280 };
            if (video.height == null) video.height = { ideal: 720 };
            if (video.frameRate == null) video.frameRate = { ideal: 30, max: 30 };

            constraints = { ...constraints, video };
          }

          return originalGetUserMedia(constraints);
        };
      } catch (err) {
        console.warn("無法套用 HD 相機偏好，改用瀏覽器預設相機設定。", err);
      }
    })();
  </script>


  <title>臺北跨時空 WebAR 主畫面</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #e8d9b8;
      color: #2f281d;
    }

    body {
      overflow-y: auto;
      overflow-x: hidden;
    }

    body.scanning {
      overflow: hidden;
    }

    #browserWarning {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,0.72);
      padding: 24px;
    }

    #browserWarning.show {

      align-items: center;
      justify-content: center;
    }

    .browser-box {
      width: 100%;
      max-width: 420px;
      background: #fff8e6;
      color: #2f281d;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      text-align: center;
    }

    .browser-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .browser-text {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 18px;
      text-align: left;
    }

    #openChromeBtn,
    #copyLinkBtn,
    #continueAnywayBtn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }

    #openChromeBtn {
      background: #222;
      color: white;
    }

    #copyLinkBtn {
      background: #d8c79a;
      color: #2f281d;
    }

    #continueAnywayBtn {
      background: rgba(255,255,255,0.65);
      color: #5a4a2c;
      border: 1px solid rgba(90,70,40,0.35);
    }

    .browser-note {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #6d5a38;
      text-align: left;
    }

    #arRoot {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: black;
      opacity: 0;
      pointer-events: none;
    }

    body.scanning #arRoot {
      opacity: 1;
      pointer-events: auto;
      z-index: 1500;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1500;
    }

    body.scanning video,
    body.scanning canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    #app {
      position: relative;
      z-index: 100;
      min-height: 100vh;
      background-image: url("./background/bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: repeat-y;
      padding-bottom: 96px;
    }

    body.scanning #app {
      display: none;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 22px 22px 16px;
      background-image: url("./background/bg.png");
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid rgba(90, 70, 40, 0.18);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
    }

    .progress {
      margin-top: 10px;
      font-size: 18px;
      color: #6d5a38;
    }

    .icon-btn {
      font-size: 30px;
      color: #5a4a2c;
      padding-top: 4px;
    }

    .cards {
      padding: 22px 18px 20px;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      margin-bottom: 22px;
      padding: 18px;
      border-radius: 14px;
      background-image: url("./background/bg.png");
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(90, 70, 40, 0.25);
      box-shadow: 0 5px 16px rgba(0,0,0,0.16);
    }

    .era {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .photo-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
    }

    .status {
      flex-shrink: 0;
      font-size: 17px;
      font-weight: 800;
      color: #8a6d24;
    }

    .status.pass {
      color: #3c8c3c;
    }

    /* 右上角狀態與歷史說明連結 */
    .status-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-left: auto;
    }

    .status-area.with-history .status {
      font-size: 14px;
    }

    .history-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #4f8f5f;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      padding: 3px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .history-link:hover,
    .history-link:focus-visible {
      color: #347247;
      text-decoration: underline;
    }

    .history-arrow {
      font-size: 29px;
      font-weight: 500;
      line-height: 0.9;
    }

    .photo-wrap {
      position: relative;
      width: 100%;
    }

    .main-photo {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      border-radius: 5px;
      border: 1px solid rgba(0,0,0,0.18);
      display: block;
      background: rgba(255,255,255,0.45);
    }

    .inline-video {
      background: black;
    }

    .scan-frame-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 52%;
      height: 28%;
      min-height: 58px;
      border: 3px solid rgba(255,255,255,0.95);
      background: rgba(0,0,0,0.18);
      color: white;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
      cursor: pointer;
      border-radius: 4px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .scan-frame-btn.pass {
      background: rgba(70, 55, 20, 0.55);
      border-color: rgba(255,255,255,0.95);
    }

    .photo-wrap.playing-video .scan-frame-btn {
      display: none;
    }

    .photo-wrap.playing-video.show-return .scan-frame-btn {
      display: block;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.50);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.45;
    }

    .message.wrong {
      background: rgba(120, 40, 30, 0.72);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 120;
      height: 78px;
      border-top: 1px solid rgba(90,70,40,0.18);
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: #7a6846;
      background-image: url("./background/bg.png");
      background-size: cover;
      background-position: center;
    }

    .nav-item {
      text-align: center;
      font-size: 14px;
      line-height: 1.25;
      cursor: pointer;
      padding: 4px 6px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .nav-icon {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .active {
      color: #2f281d;
      font-weight: bold;
    }

    #scanOverlay {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 14px;
      right: 14px;
      top: 14px;
      pointer-events: auto;
    }

    body.scanning #scanOverlay {
      display: block;
    }

    #scanMessage {
      background: rgba(0, 0, 0, 0.72);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
      margin-bottom: 10px;
    }

    #scanMessage.wrong {
      background: rgba(120, 40, 30, 0.78);
    }

    .scan-actions {
      display: flex;
      gap: 10px;
    }

    .scan-actions button {
      flex: 1;
      height: 48px;

      font-weight: bold;

      touch-action: manipulation;
      user-select: none;

    .scan-corner {
      display: none;
      position: fixed;
      z-index: 1800;
      left: 50%;
      top: 52%;
      width: 72vw;

      height: 52vw;
      max-height: 260px;
      transform: translate(-50%, -50%);

      border-radius: 6px;
      pointer-events: none;

    body.scanning .scan-corner {

    #wrongToast {
      display: none;

      z-index: 3500;
      left: 24px;
      right: 24px;
      top: 42%;
      transform: translateY(-50%);
      background: rgba(120, 40, 30, 0.88);
      color: white;
      padding: 18px 16px;

      font-size: 22px;

    @media (max-width: 420px) {
      .title {

      }

      }

      .status-area.with-history .status {
        font-size: 13px;
      }

      .history-link {

      }

      .history-arrow {
        font-size: 25px;
      }

      .main-photo {

      }

      .scan-frame-btn {
        width: 58%;
        font-size: 17px;
      }

      .nav-item {
        font-size: 13px;
      }

      .nav-icon {
        font-size: 22px;
      }
    }
  </style>

<body>

  <div id="browserWarning">
    <div class="browser-box">
      <div class="browser-title">請改用瀏覽器開啟</div>

      <div class="browser-text">
        目前偵測到你可能正在使用 <b>LINE 內建瀏覽器</b>。<br><br>
        為了正常開啟相機與 AR 掃描，請改用手機瀏覽器開啟本頁。
      </div>

      <button id="openChromeBtn">開啟瀏覽器</button>
      <button id="copyLinkBtn">複製網址</button>
      <button id="continueAnywayBtn">仍要嘗試開啟</button>

      <div class="browser-note">
        如果按鈕無效，請複製網址後改用 iPhone 內建瀏覽器或 Chrome 開啟。
      </div>
    </div>
  </div>

  <div id="arRoot">
    <a-scene
      id="arScene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </div>

  <div id="scanOverlay">
    <div id="scanMessage">正在啟動 AR 鏡頭，請允許相機權限。</div>
    <div class="scan-actions">
      <button id="submitAnswerBtn" type="button">送出答案</button>
      <button id="backScanBtn" type="button">回上一頁</button>
    </div>
  </div>

  <div class="scan-corner"></div>
  <div id="wrongToast">可惜！不是這張，請再找找看。</div>

  <div id="app">
    <div class="top-bar">
      <div class="title-row">
        <div>
          <div class="title">填滿年代表 ◎</div>
          <div class="progress" id="progressText">資料讀取中...</div>
        </div>
        <div class="icon-btn">⌕</div>
      </div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="bottom-nav">
      <div class="nav-item active" id="navAR">
        <span class="nav-icon">AR</span>
        AR掃描
      </div>

      <div class="nav-item" id="navActivity">
        <span class="nav-icon">ⓘ</span>
        活動資訊
      </div>

      <div class="nav-item" id="navSurvey">
        <span class="nav-icon">✎</span>
        問卷回饋
      </div>
    </div>
  </div>

  <script>
    const defaultImage = "./images/default.jpg";

    const activityInfoUrl = "";
    const surveyUrl = "";

    let questions = [];
    let passed = [];
    let currentScanIndex = null;
    let detectedIndex = null;
    let arRunning = false;
    let startingAR = false;
    let arReady = false;
    let wrongToastTimer = null;
    let playingVideoIndex = null;
    let videoReturnTimer = null;
    let lastButtonTapTime = 0;

    const cards = document.getElementById("cards");
    const progressText = document.getElementById("progressText");
    const scanMessage = document.getElementById("scanMessage");
    const submitAnswerBtn = document.getElementById("submitAnswerBtn");
    const backScanBtn = document.getElementById("backScanBtn");
    const wrongToast = document.getElementById("wrongToast");
    const arScene = document.getElementById("arScene");

    const browserWarning = document.getElementById("browserWarning");
    const openChromeBtn = document.getElementById("openChromeBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const continueAnywayBtn = document.getElementById("continueAnywayBtn");

    const navAR = document.getElementById("navAR");
    const navActivity = document.getElementById("navActivity");
    const navSurvey = document.getElementById("navSurvey");

    arScene.addEventListener("loaded", () => {
      arReady = true;
    });

    function openExternalLink(url, emptyMessage) {
      if (!url || url.trim() === "") {
        alert(emptyMessage);
        return;
      }

      window.open(url, "_blank");
    }

    function setupBottomNav() {
      navAR.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      navActivity.addEventListener("click", () => {
        openExternalLink(activityInfoUrl, "活動資訊網址尚未設定。");
      });

      navSurvey.addEventListener("click", () => {
        openExternalLink(surveyUrl, "問卷回饋網址尚未設定。");
      });
    }

    function isLineBrowser() {
      return navigator.userAgent.toLowerCase().includes("line");
    }

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }

    async function copyCurrentUrl(button) {
      try {
        await navigator.clipboard.writeText(window.location.href);
        button.innerText = "已複製網址";
      } catch (e) {
        button.innerText = "請長按網址複製";
      }
    }

    function showBrowserWarningIfNeeded() {
      if (!isLineBrowser()) return;

      browserWarning.classList.add("show");

      const browserTitle = document.querySelector(".browser-title");
      const browserText = document.querySelector(".browser-text");
      const browserNote = document.querySelector(".browser-note");

      if (isIOS()) {
        browserTitle.innerText = "iPhone 請用內建瀏覽器開啟";

        browserText.innerHTML = `
          目前偵測到你正在使用 <b>LINE 內建瀏覽器</b>。<br><br>
          iPhone 在 LINE 裡面常常無法正常開啟相機與 AR 掃描。<br><br>
          請複製網址後，改用 <b>iPhone 內建瀏覽器</b> 開啟本頁。
        `;

        openChromeBtn.innerText = "複製網址";

        browserNote.innerHTML = `
          操作方式：<br>
          1. 按上方「複製網址」<br>
          2. 回到 iPhone 主畫面<br>
          3. 打開藍色指南針圖案的內建瀏覽器<br>
          4. 貼上網址後開啟
        `;

        openChromeBtn.addEventListener("click", () => {
          copyCurrentUrl(openChromeBtn);
        });
      } else if (isAndroid()) {
        browserTitle.innerText = "請用 Chrome 開啟";

        browserText.innerHTML = `
          目前偵測到你正在使用 <b>LINE 內建瀏覽器</b>。<br><br>
          Android 在 LINE 裡面可能無法正常開啟相機與 AR 掃描。<br><br>
          請改用 <b>Chrome</b> 開啟本頁。
        `;

        openChromeBtn.innerText = "用 Chrome 開啟";

        browserNote.innerHTML = `
          如果按鈕無效，請點 LINE 右上角「⋯」，選擇「以瀏覽器開啟」或「在 Chrome 開啟」。
        `;

        openChromeBtn.addEventListener("click", () => {
          const cleanUrl = window.location.href.replace(/^https?:\/\//, "");
          window.location.href =
            "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        });
      } else {
        browserTitle.innerText = "請改用瀏覽器開啟";

        browserText.innerHTML = `
          目前偵測到你正在使用 <b>LINE 內建瀏覽器</b>。<br><br>
          為了正常開啟相機與 AR 掃描，請改用手機瀏覽器開啟本頁。
        `;

        openChromeBtn.innerText = "複製網址";

        browserNote.innerHTML = `
          請複製網址後，改用手機瀏覽器開啟。
        `;

        openChromeBtn.addEventListener("click", () => {
          copyCurrentUrl(openChromeBtn);
        });
      }

      copyLinkBtn.addEventListener("click", () => {
        copyCurrentUrl(copyLinkBtn);
      });

      continueAnywayBtn.addEventListener("click", () => {
        browserWarning.classList.remove("show");
      });
    }

    function showWrongToast(text = "可惜！不是這張，請再找找看。") {
      wrongToast.innerText = text;
      wrongToast.classList.add("show");

      if (wrongToastTimer) {
        clearTimeout(wrongToastTimer);
      }

      wrongToastTimer = setTimeout(() => {
        wrongToast.classList.remove("show");
      }, 1800);
    }

    function updateProgress() {
      const count = passed.filter(Boolean).length;
      const total = questions.length;
      const percent = total > 0 ? Math.round((count / total) * 100) : 0;
      progressText.innerText = `答題率：${percent}%　已完成 ${count}/${total}`;
    }

    function parseDataText(text) {
      const lines = text
        .replace(/\r/g, "")
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0);

      if (lines.length <= 1) {
        throw new Error("data.txt 沒有資料列");
      }

      const result = [];

      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split("\t");

        const num = (parts[0] || "").trim();
        const eraWest = (parts[1] || "").trim();
        const eraTw = (parts[2] || "").trim();
        const title = (parts[3] || "").trim();
        const historyMark = (parts[4] || "").trim();
        const historyUrl = (parts[5] || "").trim();

        if (!num) continue;

        result.push({
          num: Number(num),
          name: title || `第 ${num} 題`,
          era: `${eraWest}　${eraTw}`.trim(),
          historyMark,
          historyUrl,
          image: `./images/q${num}.jpg`,
          video: `./videos/q${num}.mp4`
        });
      }

      return result;
    }

    async function loadQuestionsFromData() {
      cards.innerHTML = `
        <div class="card">
          <div class="message">正在讀取 data.txt...</div>
        </div>
      `;

      try {
        const response = await fetch("./data.txt?time=" + Date.now());

        if (!response.ok) {
          throw new Error("讀不到 data.txt");
        }

        const text = await response.text();
        questions = parseDataText(text);
        passed = questions.map(() => false);

        createDynamicTargets();

        renderCards();
        updateProgress();
      } catch (err) {
        console.error(err);

        cards.innerHTML = `
          <div class="card">
            <div class="era">資料讀取失敗</div>
            <div class="message wrong">
              讀不到 data.txt。請確認 GitHub 根目錄有 data.txt，而且格式是：<br><br>
              NUM　年代_西元　年代_民國　題名　歷史說明　網址
            </div>
          </div>
        `;

        progressText.innerText = "data.txt 讀取失敗";
      }
    }

    function createDynamicTargets() {
      document.querySelectorAll("[id^='target']").forEach(el => el.remove());

      questions.forEach((q, index) => {
        const target = document.createElement("a-entity");
        target.setAttribute("id", `target${index}`);
        target.setAttribute("mindar-image-target", `targetIndex: ${index}`);
        arScene.appendChild(target);

        bindTarget(`target${index}`, index);
      });
    }

    function showReturnButtonOnVideo(video) {
      const wrap = video.closest(".photo-wrap");
      if (!wrap) return;

      wrap.classList.add("show-return");

      if (videoReturnTimer) {
        clearTimeout(videoReturnTimer);
      }

      videoReturnTimer = setTimeout(() => {
        wrap.classList.remove("show-return");
      }, 2000);
    }

    function safeTap(callback) {
      const now = Date.now();

      if (now - lastButtonTapTime < 450) {
        return;
      }

      lastButtonTapTime = now;
      callback();
    }

    function handleMainButton(index) {
      safeTap(() => {
        if (passed[index]) {
          if (questions[index].video) {
            playingVideoIndex = playingVideoIndex === index ? null : index;
            renderCards();

            const targetCard = document.querySelectorAll(".card")[index];
            if (targetCard) {
              targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          }

          return;
        }

        if (isLineBrowser()) {
          browserWarning.classList.add("show");
          return;
        }

        startAR(index);
      });
    }

    function renderCards() {
      cards.innerHTML = "";

      questions.forEach((q, index) => {
        const isPass = passed[index];
        const isPlayingVideo = playingVideoIndex === index;
        const displayImage = isPass ? q.image : defaultImage;
        const historyUrl = (q.historyUrl || "").trim();
        const hasHistory = /^https?:\/\//i.test(historyUrl);
        const safeHistoryUrl = hasHistory
          ? historyUrl.replace(/&/g, "&amp;").replace(/"/g, "&quot;")
          : "";

        let buttonText = "Go find";

        if (isPass && q.video && !isPlayingVideo) {
          buttonText = "老照片動起來";
        } else if (isPass && q.video && isPlayingVideo) {
          buttonText = "回到老照片";
        } else if (isPass) {
          buttonText = "PASS";
        }

        const mediaHtml = isPlayingVideo
          ? `
            <video
              class="main-photo inline-video"
              src="${q.video}"
              controls
              autoplay
              muted
              loop
              playsinline
              data-index="${index}"
            ></video>
          `
          : `
            <img
              class="main-photo"
              src="${displayImage}"
              alt="${isPass ? q.name : "尚未答題"}"
            >
          `;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="era">${q.era}</div>

          <div class="name-row">
            <div class="photo-name">${q.name}</div>
            <div class="status-area ${hasHistory && isPass ? "with-history" : ""}">
              <div class="status ${isPass ? "pass" : ""}" id="status-${index}">
                ${isPass ? "PASS" : "尚未辨識"}
              </div>
              ${
                hasHistory && isPass
                  ? `
                    <a
                      class="history-link"
                      href="${safeHistoryUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="開啟${q.name}的歷史說明"
                    >
                      <span>歷史<br>說明</span>
                      <span class="history-arrow" aria-hidden="true">›</span>
                    </a>
                  `
                  : ""
              }
            </div>
          </div>

          <div class="photo-wrap ${isPlayingVideo ? "playing-video" : ""}" data-index="${index}">
            ${mediaHtml}
            <button type="button" class="scan-frame-btn ${isPass ? "pass" : ""}" data-index="${index}">
              ${buttonText}
            </button>
          </div>

          <div class="message" id="msg-${index}">
            ${
              isPass
                ? (
                    q.video
                      ? (
                          isPlayingVideo
                            ? `影片播放中。點一下影片，可顯示「回到老照片」。`
                            : `已完成「${q.name}」，可按「老照片動起來」觀看動態影像。`
                        )
                      : `已完成「${q.name}」`
                  )
                : `請按 Go find 後，尋找並掃描對應老照片。`
            }
          </div>
        `;

        cards.appendChild(card);
      });

      document.querySelectorAll(".scan-frame-btn").forEach(btn => {
        const index = Number(btn.dataset.index);

        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleMainButton(index);
        });

        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleMainButton(index);
        }, { passive: false });

        btn.addEventListener("pointerup", (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleMainButton(index);
        });
      });

      document.querySelectorAll(".inline-video").forEach(video => {
        video.addEventListener("click", () => {
          showReturnButtonOnVideo(video);
        });

        video.addEventListener("touchstart", () => {
          showReturnButtonOnVideo(video);
        });
      });

      updateProgress();
    }

    function getMindARSystem() {
      return arScene.systems && arScene.systems["mindar-image-system"];
    }

    function waitForMindARSystem(timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const startTime = Date.now();

        const timer = setInterval(() => {
          const system = getMindARSystem();

          if (system) {
            clearInterval(timer);
            resolve(system);
            return;
          }

          if (Date.now() - startTime > timeoutMs) {
            clearInterval(timer);
            reject(new Error("MindAR system timeout"));
          }
        }, 100);
      });
    }

    async function startAR(index) {
      if (startingAR || arRunning) return;

      currentScanIndex = index;
      detectedIndex = null;
      playingVideoIndex = null;
      startingAR = true;

      scanMessage.classList.remove("wrong");
      wrongToast.classList.remove("show");
      document.querySelectorAll(".message").forEach(el => el.classList.remove("wrong"));

      document.body.classList.add("scanning");
      scanMessage.innerText = "正在啟動 AR 鏡頭，請允許相機權限。";

      try {
        if (!arReady && !arScene.hasLoaded) {
          await new Promise(resolve => {
            arScene.addEventListener("loaded", resolve, { once: true });
          });
        }

        const mindarSystem = await waitForMindARSystem();

        await mindarSystem.start();

        arRunning = true;
        scanMessage.classList.remove("wrong");
        scanMessage.innerText = "請將白框對準你找到的老照片，辨識後按「送出答案」。";
      } catch (err) {
        console.error(err);

        arRunning = false;
        startingAR = false;
        scanMessage.classList.add("wrong");

        if (err.name === "NotAllowedError" || err.name === "SecurityError") {
          if (isIOS()) {
            scanMessage.innerText = "相機權限未開啟。請用 iPhone 內建瀏覽器開啟，並允許相機。";
          } else {
            scanMessage.innerText = "相機權限未開啟。請用 Chrome 開啟，並允許相機權限。";
          }
        } else {
          scanMessage.innerText = "相機沒有成功開啟。請重新整理頁面後，再按 Go find。";
        }
      } finally {
        startingAR = false;
      }
    }

    async function stopAR() {
      try {
        const mindarSystem = getMindARSystem();

        if (mindarSystem && arRunning) {
          await mindarSystem.stop();
          await new Promise(resolve => setTimeout(resolve, 350));
        }
      } catch (err) {
        console.warn(err);
      }

      arRunning = false;
      startingAR = false;

      document.body.classList.remove("scanning");
      scanMessage.classList.remove("wrong");
      wrongToast.classList.remove("show");
    }

    async function submitAnswer() {
      if (currentScanIndex === null) {
        return;
      }

      const targetIndex = currentScanIndex;

      if (detectedIndex === null) {
        showWrongToast("可惜！不是這張，請再找找看。");
        scanMessage.classList.remove("wrong");
        scanMessage.innerText = "請繼續將白框對準你找到的老照片，辨識後再按「送出答案」。";
        return;
      }

      if (detectedIndex !== targetIndex) {
        showWrongToast("可惜！不是這張，請再找找看。");
        detectedIndex = null;
        scanMessage.classList.remove("wrong");
        scanMessage.innerText = "請繼續尋找正確照片，辨識後再按「送出答案」。";
        return;
      }

      passed[targetIndex] = true;
      playingVideoIndex = null;

      await stopAR();

      currentScanIndex = null;
      detectedIndex = null;

      renderCards();

      const targetCard = document.querySelectorAll(".card")[targetIndex];
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    async function backToPage() {
      scanMessage.classList.remove("wrong");
      wrongToast.classList.remove("show");
      currentScanIndex = null;
      detectedIndex = null;
      await stopAR();
    }

    function bindTarget(targetId, index) {
      const target = document.getElementById(targetId);
      if (!target) return;

      target.addEventListener("targetFound", () => {
        detectedIndex = index;

        if (currentScanIndex === null) return;

        if (index === currentScanIndex) {
          scanMessage.classList.remove("wrong");
          scanMessage.innerText = `已掃描到「${questions[index].name}」，請按「送出答案」。`;
        } else {
          showWrongToast("可惜！不是這張，請再找找看。");
          scanMessage.classList.remove("wrong");
          scanMessage.innerText = "目前掃到的不是這一題，請繼續尋找正確照片。";
        }
      });

      target.addEventListener("targetLost", () => {
        if (currentScanIndex !== null) {
          scanMessage.classList.remove("wrong");
          scanMessage.innerText = "請將白框對準你找到的老照片，辨識後按「送出答案」。";
        }
      });
    }

    submitAnswerBtn.addEventListener("click", submitAnswer);
    backScanBtn.addEventListener("click", backToPage);

    setupBottomNav();
    showBrowserWarningIfNeeded();
    loadQuestionsFromData();
  </script>


  <!-- PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.warn("Service Worker 註冊失敗：", err);
        });
      });
    }
  </script>
